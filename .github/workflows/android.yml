# GitHub에 올리면 자동으로 안드로이드 앱을 만들어 주는 설정
# - 매번: 내 폰 설치용 APK (app-debug.apk)
# - Secrets에 서명키가 있으면: 플레이스토어 업로드용 AAB (app-release.aab)
name: Android 앱 빌드

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04  # Android SDK가 기본 설치된 서버
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK 확인
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls $ANDROID_HOME/platforms | tail -3

      - name: 웹 화면 빌드
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: 내 폰 설치용 APK 만들기
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: 문서뷰어-설치용-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: 플레이스토어용 AAB 만들기 (서명키가 있을 때만)
        if: ${{ env.KEYSTORE_B64 != '' }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        working-directory: android
        run: |
          echo "$KEYSTORE_B64" | base64 -d > $RUNNER_TEMP/release.jks
          export ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks
          ./gradlew bundleRelease

      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('android/app/build/outputs/bundle/release/*.aab') != '' }}
        with:
          name: 문서뷰어-플레이스토어-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
